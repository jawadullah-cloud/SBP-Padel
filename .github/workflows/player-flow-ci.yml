name: Player Flow CI
on:
  push:
    branches: [backend-v1-dev]
    paths: ['docs/**','dev_player_server.py','qa/player_runtime_browser.mjs','qa/player_booking_lifecycle_browser.mjs','qa/player_account_browser.mjs','qa/player_theme_browser.mjs','qa/player_navigation_recovery_browser.mjs','qa/player_review_mobile_browser.mjs','qa/player_splash_session_browser.mjs','.github/workflows/player-flow-ci.yml']
  pull_request:
    paths: ['docs/**','dev_player_server.py','qa/player_runtime_browser.mjs','qa/player_booking_lifecycle_browser.mjs','qa/player_account_browser.mjs','qa/player_theme_browser.mjs','qa/player_navigation_recovery_browser.mjs','qa/player_review_mobile_browser.mjs','qa/player_splash_session_browser.mjs','.github/workflows/player-flow-ci.yml']
jobs:
  player-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: JavaScript syntax
        run: |
          for f in docs/runtime-api.js docs/booking-participants-live.js docs/review-entry.js docs/review-players-live.js docs/booking-success-live.js docs/digital-pass-live.js docs/bookings-entry.js docs/main-navigation-hardening.js docs/player-bookings-live.js docs/player-booking-detail-live.js docs/player-booking-integrity.js docs/booking-detail-polish.js docs/saved-players-sync.js docs/player-profile-live.js docs/player-payment-history-live.js docs/player-wallet-live.js docs/profile-modules.js docs/theme-bridge.js docs/navigation-fix.js docs/deep-route-smooth.js docs/notifications-live.js docs/booking-date-more.js docs/deep-router.js docs/review-native.js docs/native-transitions.js docs/player-stability.js docs/player-venues-live.js qa/player_runtime_browser.mjs qa/player_booking_lifecycle_browser.mjs qa/player_account_browser.mjs qa/player_theme_browser.mjs qa/player_navigation_recovery_browser.mjs qa/player_review_mobile_browser.mjs qa/player_splash_session_browser.mjs docs/sw.js; do node --check "$f"; done
      - name: Architecture guards
        shell: bash
        run: |
          grep -q 'sbpPadelBookingSessionV2' docs/review-entry.js
          grep -q 'data-sbp-step' docs/review-entry.js
          grep -q '/payments/initiate' docs/review-entry.js
          grep -q 'review-entry.js' dev_player_server.py
          grep -q 'data-live-manage' docs/player-bookings-live.js
          grep -q 'SBPDeepRoute' docs/player-bookings-live.js
          grep -q 'main-navigation-hardening.js' docs/bookings-entry.js
          grep -q 'clearStaleInteractionState' docs/main-navigation-hardening.js
          grep -q 'deep-route-smooth.js' dev_player_server.py
          grep -q '/notifications/me' docs/notifications-live.js
          grep -q '/bookings/me' docs/player-bookings-live.js
          grep -q '/auth/me' docs/player-profile-live.js
          grep -q '/payments/me' docs/player-payment-history-live.js
          grep -q '/reschedule' docs/player-booking-detail-live.js
          grep -q '/cancel' docs/player-booking-detail-live.js
          grep -q '/refund' docs/player-booking-detail-live.js
          grep -q '/participants' docs/digital-pass-live.js
          grep -q 'VALID_PASS_STATUSES' backend/app/api/booking_passes.py
          grep -q 'saved-players-sync.js' dev_player_server.py
          grep -q 'player-booking-integrity.js' dev_player_server.py
          grep -q 'booking-detail-polish.js' dev_player_server.py
          grep -q 'court_id:selectedCourt' docs/player-booking-integrity.js
          grep -q 'place-items:center' docs/booking-detail-polish.js
          grep -q 'background:var(--brand)' docs/booking-detail-polish.js
          grep -q 'sbpToolsReady' docs/booking-detail-polish.js
          grep -q 'visibility:hidden' dev_player_server.py
          grep -q 'AUTH_SESSION_SPLASH_BOOTSTRAP' dev_player_server.py
          grep -q 'sbp-session-splash' dev_player_server.py
          grep -q 'SBPToggleTheme' docs/theme-bridge.js
          grep -q 'X-SBP-Padel-Build' dev_player_server.py
          grep -q 'quick.slice(6)' docs/booking-date-more.js
          grep -q '#reviewNative' docs/mobile-runtime.js
          grep -q 'CANONICAL_REVIEW_BOOTSTRAP' dev_player_server.py
          grep -q '__reviewNative' docs/review-native.js
          ! grep -q 'Adeel Raza' docs/player-profile-live.js
          ! grep -q 'PDL-002381' docs/digital-pass-live.js
          ! grep -qi 'Continue with Google' docs/auth-preview.html
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser runtime interaction QA
        shell: bash
        run: |
          set -o pipefail
          python dev_player_server.py > /tmp/sbp-player-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do if curl -fsS http://127.0.0.1:5173/index.html >/dev/null; then break; fi; sleep 1; done
          { node qa/player_runtime_browser.mjs && node qa/player_booking_lifecycle_browser.mjs && node qa/player_account_browser.mjs && node qa/player_theme_browser.mjs && node qa/player_navigation_recovery_browser.mjs && node qa/player_review_mobile_browser.mjs && node qa/player_splash_session_browser.mjs; } 2>&1 | tee /tmp/player-qa.log
      - name: Upload browser QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-browser-qa-log
          path: |
            /tmp/player-qa.log
            /tmp/sbp-player-dev.log
          if-no-files-found: ignore
          retention-days: 3
