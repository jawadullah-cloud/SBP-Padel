name: Android APKs

on:
  push:
    branches: [backend-v1-dev]
    paths:
      - 'android/**'
      - 'docs/mobile-runtime.js'
      - 'docs/digital-pass-live.js'
      - 'docs/player-venues-live.js'
      - 'docs/player-profile-live.js'
      - 'docs/player-bookings-live.js'
      - 'dev_player_server.py'
      - 'run_backend_lan.ps1'
      - 'run_player_lan.ps1'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Restore development signing key
        working-directory: android
        run: base64 --decode dev-signing-key.b64 > dev-signing.keystore
      - name: Verify development signing key
        working-directory: android
        run: keytool -list -keystore dev-signing.keystore -storepass sbppadeldev -alias sbppadeldev
      - name: Build debug and secure release-candidate APKs
        working-directory: android
        run: gradle :app:assembleDebug :app:assembleReleaseCandidate --stacktrace
      - name: Verify APKs exist
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -f android/app/build/outputs/apk/releaseCandidate/app-releaseCandidate.apk
      - name: Verify release-candidate manifest security
        shell: bash
        run: |
          set -euo pipefail
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump xmltree android/app/build/outputs/apk/releaseCandidate/app-releaseCandidate.apk AndroidManifest.xml > /tmp/manifest.txt
          grep -q 'android:usesCleartextTraffic' /tmp/manifest.txt
          if grep 'android:usesCleartextTraffic' /tmp/manifest.txt | grep -q '0xffffffff'; then
            echo 'Release candidate unexpectedly permits cleartext traffic'; exit 1
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: sbp-padel-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release-candidate APK
        uses: actions/upload-artifact@v6
        with:
          name: sbp-padel-1.0.0-rc1-apk
          path: android/app/build/outputs/apk/releaseCandidate/app-releaseCandidate.apk
          if-no-files-found: error
