name: Android Debug APK

on:
  push:
    branches: [backend-v1-dev]
    paths:
      - 'android/**'
      - 'docs/mobile-runtime.js'
      - 'docs/digital-pass-live.js'
      - 'docs/player-venues-live.js'
      - 'docs/player-profile-live.js'
      - 'docs/player-bookings-live.js'
      - 'dev_player_server.py'
      - 'run_backend_lan.ps1'
      - 'run_player_lan.ps1'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore development signing key
        working-directory: android
        run: base64 --decode dev-signing-key.b64 > dev-signing.keystore
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sbp-padel-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
