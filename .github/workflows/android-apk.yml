name: Android APKs

on:
  push:
    branches: [backend-v1-dev]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Restore development signing key
        working-directory: android
        run: base64 --decode dev-signing-key.b64 > dev-signing.keystore
      - name: Verify development signing key
        working-directory: android
        run: keytool -list -keystore dev-signing.keystore -storepass sbppadeldev -alias sbppadeldev
      - name: Verify accepted Android implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/src/main/java/pk/gov/punjab/sbp/padel/MainActivity.java
          test ! -f android/app/src/main/java/pk/gov/punjab/sbp/padel/MainActivity.kt
          grep -q 'class MainActivity extends Activity' android/app/src/main/java/pk/gov/punjab/sbp/padel/MainActivity.java
          grep -q 'loadReleasePlayer' android/app/src/main/java/pk/gov/punjab/sbp/padel/MainActivity.java
      - name: Build accepted debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - name: Build accepted secure release-candidate APK
        working-directory: android
        run: gradle :app:assembleReleaseCandidate --stacktrace
      - name: Verify accepted release-candidate security
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/releaseCandidate/app-releaseCandidate.apk
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test -f android/app/build/outputs/mapping/releaseCandidate/mapping.txt
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest.txt
          grep -q 'android:usesCleartextTraffic' /tmp/manifest.txt
          if grep 'android:usesCleartextTraffic' /tmp/manifest.txt | grep -q '0xffffffff'; then
            echo 'Accepted release candidate unexpectedly permits cleartext traffic'; exit 1
          fi
      - name: Upload accepted debug APK
        uses: actions/upload-artifact@v6
        with:
          name: sbp-padel-accepted-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload accepted release-candidate APK
        uses: actions/upload-artifact@v6
        with:
          name: sbp-padel-1.0.0-rc1-accepted-app-apk
          path: android/app/build/outputs/apk/releaseCandidate/app-releaseCandidate.apk
          if-no-files-found: error
