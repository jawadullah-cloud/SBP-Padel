name: Security CI

on:
  push:
    branches: [backend-v1-dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan complete Git history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --report-format json --report-path /tmp/gitleaks-report.json
      - name: Upload redacted scan diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gitleaks-redacted-report
          path: /tmp/gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 3
