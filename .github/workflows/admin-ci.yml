name: Admin Portal CI
on:
  push:
    branches: [backend-v1-dev]
    paths: ['admin/**','run_admin_dev.ps1','.github/workflows/admin-ci.yml']
  pull_request:
    paths: ['admin/**','run_admin_dev.ps1','.github/workflows/admin-ci.yml']
jobs:
  build-and-admin-runtime:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: admin}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22',cache: npm,cache-dependency-path: admin/package.json}
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start admin runtime
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/sbp-padel-admin.log 2>&1 &
          for i in {1..60}; do if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/sbp-padel-admin.log; exit 1
      - name: Admin browser runtime QA
        shell: bash
        run: |
          set -o pipefail
          npm run test:admin 2>&1 | tee /tmp/admin-qa.log
      - name: Upload admin QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-browser-qa-log
          path: |
            /tmp/admin-qa.log
            /tmp/sbp-padel-admin.log
          if-no-files-found: ignore
          retention-days: 3
