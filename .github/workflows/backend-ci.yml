name: Backend CI
on:
  push:
    branches: [backend-v1-dev]
    paths: ['backend/**','.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**','.github/workflows/backend-ci.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sbp
          POSTGRES_PASSWORD: sbp
          POSTGRES_DB: sbp_padel_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sbp -d sbp_padel_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_REQUIRED: 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff
        run: ruff check app tests
      - name: Tests
        run: pytest -q --junitxml=pytest-results.xml
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-results
          path: backend/pytest-results.xml
          if-no-files-found: ignore
          retention-days: 3
      - name: Migration graph check
        run: alembic heads
      - name: Fresh PostgreSQL migration smoke test
        env:
          DATABASE_URL: postgresql+asyncpg://sbp:sbp@127.0.0.1:5432/sbp_padel_ci
          ENVIRONMENT: development
        run: |
          alembic upgrade head
          alembic current
          alembic check
      - name: Production configuration preflight
        env:
          ENVIRONMENT: production
          DATABASE_URL: postgresql+asyncpg://sbp:ci-only@db.example/sbp_padel
          JWT_SECRET: ci-only-production-preflight-secret-000000000000
          CORS_ORIGINS: https://admin.example,https://player.example
          SMTP_HOST: smtp.example
          SMTP_FROM_EMAIL: no-reply@example
          REDIS_REQUIRED: 'false'
          REDIS_URL: ''
        run: python scripts/production_preflight.py
