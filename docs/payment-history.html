<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Payment History · SBP Padel</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--brand:#91ee1b;--bg:#061012;--surface:#0c1919;--surface2:#112321;--line:#1f3733;--text:#f5f8f4;--muted:#8d9d97;--sport:'Barlow Condensed',sans-serif;--ui:'Inter',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#06100d;display:grid;place-items:center;font-family:var(--ui);color:var(--text)}button{font:inherit}.phone{width:min(390px,100vw);height:min(800px,100dvh);background:var(--bg);overflow:hidden;position:relative;border-radius:38px;border:1px solid #29413b}.status{height:28px;padding:9px 20px 0;display:flex;justify-content:space-between;font-size:10px;font-weight:800}.screen{height:calc(100% - 28px);overflow:auto;padding:10px 16px 26px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.head{display:flex;align-items:center;gap:11px;margin-bottom:14px}.back{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:#fff}.head small{display:block;color:var(--brand);font:800 9px var(--sport);letter-spacing:.1em}.head h1{font-size:22px;margin:2px 0 0}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}.summary div{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}.summary small,.summary b{display:block}.summary small{font-size:8px;color:var(--muted)}.summary b{font:800 17px var(--sport);margin-top:4px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:4px;background:#0a1714;border:1px solid var(--line);border-radius:14px;margin-bottom:12px}.tabs button{height:34px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:800 9px var(--sport)}.tabs button.on{background:#172a22;color:var(--brand)}.list{display:grid;gap:8px}.entry{padding:11px;border:1px solid var(--line);background:var(--surface);border-radius:14px}.row{display:flex;justify-content:space-between;gap:12px}.entry b,.entry small{display:block}.entry b{font-size:10px}.entry small{font-size:8px;color:var(--muted);margin-top:3px}.money{font:800 12px var(--sport);white-space:nowrap}.money.refund{color:var(--brand)}.details{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.details div{background:var(--surface2);border-radius:9px;padding:8px}.details span,.details strong{display:block}.details span{font-size:7px;color:var(--muted)}.details strong{font-size:8px;margin-top:3px}.receipt{width:100%;height:34px;margin-top:8px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--text);font:800 9px var(--sport)}.statusPaid{color:var(--brand)}.statusRefund{color:#ffd477}.empty{display:none;text-align:center;padding:54px 20px;color:var(--muted);font-size:9px}.empty.show{display:block}.entry[hidden]{display:none!important}@media(max-width:430px){.phone{width:100vw;height:100dvh;border:0;border-radius:0}}</style></head><body><div class="phone"><div class="status"><b>9:41</b><span>▮▮ ◉ ▰</span></div><main class="screen"><div class="head"><button class="back">←</button><div><small>PROFILE</small><h1>Payment History</h1></div></div><div class="summary"><div><small>Total paid</small><b>—</b></div><div><small>Total refunded</small><b>—</b></div></div><div class="tabs"><button class="on" data-filter="all">All</button><button data-filter="payments">Payments</button><button data-filter="refunds">Refunds</button></div><div class="list" id="list"><div class="empty show">Loading payment history…</div></div><div class="empty" id="empty">No transactions in this category.</div></main></div></body></html>
